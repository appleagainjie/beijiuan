<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#21b5a6">
<title>背就完事儿了</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css?v=20260822h">
</head>
<body class="theme-mint-rabbit">
<header id="topbar">
  <span id="apptitle">背就完事儿了</span>
  <span id="subtitle"></span>
  <span id="userbar" class="hidden">
    <span id="uname"></span>
    <button id="logout" class="ubtn">退出</button>
  </span>
</header>
<main id="view"></main>
<nav id="tabbar"></nav>
<div id="overlay" class="hidden"></div>

<!-- 登录 / 注册层（无后端时自动隐藏） -->
<div id="auth" class="hidden">
  <div class="authcard">
    <div class="amascot">🐰</div>
    <div class="alogo">背就完事儿了</div>
    <div class="atag">你背过的每一个知识点，都是上岸的台阶 ✨</div>
    <p class="asub" id="auth-subtitle">一次登录，下次自动进入 · 数据为你保留</p>
    <input id="au" class="inp" placeholder="手机号（11 位）" autocomplete="username">
    <input id="ap" class="inp" type="password" placeholder="密码（≥6 位）" autocomplete="current-password">
    <button class="btn primary" id="btn-login">开始今天的逆袭 💪</button>
    <p class="hint" id="auth-msg"></p>
    <div class="aquote" id="auth-quote">星光不负赶路人，时光不负有心人。</div>
  </div>
</div>

<script src="app.js?v=20260822h" defer></script>
</body>
</html>
